<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>EduQuest - Panel Umiejętności i Misji</title>
    <style>
      .boot-loader {
        align-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 87, 34, 0.18), transparent 34%),
          rgba(4, 4, 8, 0.98);
        color: #f5f5f5;
        display: flex;
        font-family: "Rajdhani", sans-serif;
        inset: 0;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        position: fixed;
        z-index: 9999;
      }

      .boot-loader::before {
        background-image:
          linear-gradient(rgba(255, 193, 7, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 193, 7, 0.08) 1px, transparent 1px);
        background-size: 42px 42px;
        content: "";
        inset: 0;
        opacity: 0.55;
        position: absolute;
      }

      .boot-loader__panel {
        align-items: center;
        display: grid;
        gap: 16px;
        justify-items: center;
        padding: 32px 24px;
        position: relative;
        text-align: center;
        width: min(100% - 32px, 420px);
      }

      .boot-loader__rings {
        align-items: center;
        display: flex;
        height: min(58vw, 300px);
        justify-content: center;
        position: relative;
        width: min(58vw, 300px);
      }

      .boot-loader__ring,
      .boot-loader__core {
        backface-visibility: hidden;
        border-radius: 999px;
        position: absolute;
        transform: translate3d(0, 0, 0);
        will-change: transform;
      }

      .boot-loader__ring::after,
      .boot-loader__core::after {
        background: rgba(4, 4, 8, 0.98);
        border-radius: inherit;
        content: "";
        inset: 5px;
        position: absolute;
      }

      .boot-loader__ring--outer {
        animation: boot-loader-spin 1.65s linear infinite;
        background: conic-gradient(from 0deg, transparent 0deg 42deg, #00ffff 72deg, transparent 126deg 214deg, #ffc107 252deg, transparent 306deg);
        height: 100%;
        width: 100%;
      }

      .boot-loader__ring--middle {
        animation: boot-loader-spin-reverse 1.15s linear infinite;
        background: conic-gradient(from 0deg, transparent 0deg 52deg, #ff5722 88deg, transparent 136deg 240deg, #00ffff 282deg, transparent 330deg);
        height: 72%;
        opacity: 0.92;
        width: 72%;
      }

      .boot-loader__ring--inner {
        animation: boot-loader-spin 0.85s linear infinite;
        background: conic-gradient(from 0deg, transparent 0deg 65deg, #ffc107 98deg, transparent 142deg 250deg, #00ffff 294deg, transparent 338deg);
        height: 42%;
        opacity: 0.9;
        width: 42%;
      }

      .boot-loader__core {
        animation: boot-loader-pulse 1.4s ease-in-out infinite;
        background: radial-gradient(circle, rgba(255, 193, 7, 0.94) 0 18%, rgba(255, 87, 34, 0.5) 19% 34%, transparent 35%);
        height: 20%;
        width: 20%;
      }

      .boot-loader__eyebrow {
        color: #ffc107;
        font-family: "Orbitron", sans-serif;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.18em;
        margin: 0;
        text-transform: uppercase;
      }

      .boot-loader h1 {
        color: #fff;
        font-family: "Orbitron", sans-serif;
        font-size: clamp(26px, 8vw, 42px);
        line-height: 1.05;
        margin: 0;
        text-transform: uppercase;
      }

      .boot-loader__bar {
        background: rgba(255, 255, 255, 0.1);
        height: 4px;
        overflow: hidden;
        width: min(260px, 72vw);
      }

      .boot-loader__bar span {
        animation: boot-loader-scan 1.35s ease-in-out infinite;
        background: linear-gradient(90deg, transparent, #ffc107, #ff5722, transparent);
        display: block;
        height: 100%;
        transform: translateX(-100%);
        width: 70%;
      }

      @keyframes boot-loader-spin {
        to {
          transform: translate3d(0, 0, 0) rotate(360deg);
        }
      }

      @keyframes boot-loader-spin-reverse {
        to {
          transform: translate3d(0, 0, 0) rotate(-360deg);
        }
      }

      @keyframes boot-loader-pulse {
        0%,
        100% {
          opacity: 0.78;
          transform: translate3d(0, 0, 0) scale(0.94);
        }
        50% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1.04);
        }
      }

      @keyframes boot-loader-scan {
        to {
          transform: translateX(180%);
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-DOMfiQwf.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DhZzZCBg.css">
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-live="polite" aria-label="Ladowanie strony">
        <div class="boot-loader__panel">
          <div class="boot-loader__rings" aria-hidden="true">
            <span class="boot-loader__ring boot-loader__ring--outer"></span>
            <span class="boot-loader__ring boot-loader__ring--middle"></span>
            <span class="boot-loader__ring boot-loader__ring--inner"></span>
            <span class="boot-loader__core"></span>
          </div>
          <p class="boot-loader__eyebrow">Code Quest</p>
          <h1>Ladowanie misji</h1>
          <div class="boot-loader__bar" aria-hidden="true"><span></span></div>
        </div>
      </div>
    </div>
  </body>
</html>
